<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Manager App</title>
    <!-- CSS -->
    <link rel="stylesheet" href="styles/style.css">

    <!-- Remix Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
    <!-- Header -->
    <header class="glass-header">
        <h1 class="logo">Recipe<span>X</span> </h1>
        <nav>
            <form id="searchForm" role="search" aria-label="Recipe Search">
                <i class="ri-search-line"></i>
                <input type="search" id="inputSearch" placeholder="Search recipes by title..."
                    aria-label="Search recipes" />
            </form>
            <select id="filterDifficulty" class="filter-select" aria-label="Filter recipes by difficulty">
                <option value="All">Filter by Difficulty</option>
                <option value="Easy">Easy</option>
                <option value="Medium">Medium</option>
                <option value="Hard">Hard</option>
            </select>
            <select id="filterTime" class="filter-select" aria-label="Filter recipes by time">
                <option value="All">Filter by Time</option>
                <option value="lessthanfifteen">&lt; 15 min</option>
                <option value="between">15 - 30 min</option>
                <option value="morethanthirty">&gt; 30 min</option>
            </select>
        </nav>
        <button type="button" id="btnAddRecipe" aria-label="Add Recipe Button">Add Recipe</button>
    </header>

    <!-- Main Content -->
    <main>
        <section id="recipeList" class="recipe-grid"></section>
        <section id="recipeForm" class="hidden"></section>
        <section id="recipeDetail" class="hidden"></section>
        <div id="errorContainer" role="alert" class="error-message"></div>
    </main>

    <!-- Scripts -->
    <script src="scripts/main.js" type="module"></script>
    <script src="scripts/storage.js" type="module"></script>
    <script src="scripts/ui.js" type="module"></script>
    <script src="scripts/validation.js" type="module"></script>
</body>

</html>
